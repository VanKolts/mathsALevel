name: Validate

# Deploying this site is a push to main, so the useful moment to catch a broken build is
# right here. Runs on pushes and pull requests; zero dependencies (the render test uses the
# runner's own Chrome), so it finishes in well under a minute.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: scripts/render-smoke-test.mjs drives Chrome with Node's built-in WebSocket,
      # which 20 does not have. The runner image ships Google Chrome, so nothing is installed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Syntax-checks every inline <script>, sw.js and each data/*.js file, then asserts the
      # invariants the app depends on: paper marks summing to their real Edexcel totals, every
      # past-paper tag resolving to a canonical topic name, lvls/diff arrays matching their
      # topic lists, and the chapter-rename map staying idempotent.
      #
      # Deliberately `npm test` rather than the commands spelled out again. This step had
      # drifted into a subset of it — the icon-index check and the exam-ramp suite ran only
      # on a developer's machine — and two lists of the same thing is one list to forget.
      - name: Validate app and data
        run: npm test
